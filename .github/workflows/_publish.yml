# Shared last step of every language workflow: attest the files the build jobs uploaded
# (out-* artifacts) and create the GitHub release <repo>-<tag> with them plus release.json, which
# git.vkut.me reads for its download buttons. The only job with write access. release.json and the
# notes come from .github/scripts/release.py.
name: publish

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
      tag_object:
        type: string
        required: true
      object_format:
        type: string
        required: true
      signer:
        type: string
        required: true
      notes:
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: builder
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: out-*
          merge-multiple: true
          path: out

      - name: Attest
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          TAG_OBJECT: ${{ inputs.tag_object }}
          OBJECT_FORMAT: ${{ inputs.object_format }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SIGNER: ${{ inputs.signer }}
          NOTES: ${{ inputs.notes }}
          SOURCE_BASE: https://git.vkut.me
        run: |
          set -euo pipefail
          export RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 builder/.github/scripts/release.py json out >release.json
          python3 builder/.github/scripts/release.py notes release.json >notes.md
          gh release create "$REPO-$TAG" out/* release.json -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$REPO $TAG" --notes-file notes.md --latest=false
